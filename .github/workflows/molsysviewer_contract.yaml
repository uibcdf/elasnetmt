name: MolSysViewer add-on contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 9 * * MON"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ElasNetMT and current MolSysViewer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --upgrade "molsysviewer @ git+https://github.com/uibcdf/molsysviewer.git@main"

      - name: Verify the add-on contract
        run: python -m pytest tests/integration/test_molsysviewer_addon.py -q
